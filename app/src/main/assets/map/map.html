<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="stylesheet" href="maplibre-gl.css">
  <style>
    html, body { margin: 0; background: #0f1420; font: 14px/1.2 sans-serif; color: #e6e8f0; }
    /* Fixed positioning, so layout never depends on the page having a resolved height. */
    #map { position: fixed; top: 0; right: 0; bottom: 0; left: 0; }
    #overlay { position: absolute; left: 0; top: 0; right: 0; bottom: 0; pointer-events: none; }

    .bar { position: fixed; z-index: 2; display: flex; align-items: center; gap: 8px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    #menuBtn {
      position: fixed; z-index: 3; top: 12px; left: 12px; width: 44px; height: 44px; border-radius: 22px;
      border: 0; background: rgba(30, 34, 48, 0.92); color: #e6e8f0; font-size: 22px; padding: 0;
    }
    #layerName {
      position: fixed; z-index: 2; top: 12px; left: 64px; height: 44px; line-height: 44px; padding: 0 16px;
      border-radius: 22px; background: rgba(30, 34, 48, 0.92); max-width: calc(100% - 140px);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #menu { position: fixed; z-index: 5; top: 0; right: 0; bottom: 0; left: 0; display: flex; }
    #menu .sheet {
      width: min(320px, 82%); box-sizing: border-box; overflow-y: auto; padding: 14px 12px 28px;
      background: #171c2a; box-shadow: 4px 0 24px rgba(0, 0, 0, 0.5);
    }
    #menu .backdrop { flex: 1; background: rgba(0, 0, 0, 0.45); }
    #menu h2 { font-size: 20px; margin: 4px 8px 6px; font-weight: 500; }
    #menu .group {
      display: flex; justify-content: space-between; align-items: center; width: 100%; box-sizing: border-box;
      border: 0; background: none; font: inherit; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
      color: #9aa0b8; padding: 14px 12px 8px; text-align: left;
    }
    #menu .group.open { color: #e6e8f0; }
    #menu .item {
      display: block; width: 100%; border: 0; background: none; color: #e6e8f0; font: inherit;
      padding: 12px; border-radius: 12px; text-align: left;
    }
    #menu .item.on { background: #4a4f7a; color: #fff; }
    .chip {
      border: 0; border-radius: 18px; padding: 8px 14px; font: inherit; color: #e6e8f0;
      background: rgba(30, 34, 48, 0.88);
    }
    .chip.on { background: #4a4f7a; color: #fff; }

    #legend {
      position: fixed; z-index: 2; left: 12px; right: 12px; bottom: 84px;
      padding: 6px 14px 4px; border-radius: 16px; background: rgba(30, 34, 48, 0.88);
    }
    #legend .gradient { height: 8px; border-radius: 4px; }
    #legend .labels { position: relative; height: 16px; font-size: 11px; margin-top: 3px; }
    #legend .labels span { position: absolute; white-space: nowrap; }

    #controls {
      position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 2;
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px; border-radius: 28px; background: rgba(30, 34, 48, 0.88);
    }
    #play { width: 40px; height: 40px; border-radius: 20px; border: 0; flex: none; background: #4a4f7a; color: #fff; font-size: 16px; }
    #slider { flex: 1; min-width: 0; }
    #time { flex: none; min-width: 78px; text-align: right; font-variant-numeric: tabular-nums; }
    #readout {
      position: fixed; z-index: 2; left: 12px; bottom: 146px; min-width: 150px;
      padding: 10px 14px; border-radius: 16px; background: rgba(30, 34, 48, 0.92);
    }
    #readout .close { position: absolute; top: 2px; right: 6px; border: 0; background: none; color: #9aa0b8; font-size: 18px; padding: 4px; }
    #readout .speed { font-size: 26px; font-weight: 500; font-variant-numeric: tabular-nums; }
    #readout .arrow { display: inline-block; font-size: 22px; margin-right: 6px; }
    #readout .forecastBtn {
      margin-top: 8px; border: 0; border-radius: 14px; padding: 7px 14px; background: #4a4f7a; color: #fff; font: inherit; font-size: 13px;
    }
    #readout .meta { font-size: 12px; color: #9aa0b8; margin-top: 2px; }
    #status { position: fixed; z-index: 2; top: 70px; left: 12px; right: 12px; text-align: center; font-size: 13px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="status"></div>

  <button id="menuBtn" aria-label="Layers">☰</button>
  <div id="layerName"></div>
  <div id="menu" hidden>
    <div class="sheet" id="menuSheet"></div>
    <div class="backdrop" id="menuBackdrop"></div>
  </div>

  <div id="readout" hidden>
    <button class="close" id="readoutClose" aria-label="Close">✕</button>
    <div id="readoutWind"><span class="speed"><span class="arrow" id="readoutArrow">↑</span><span id="readoutSpeed"></span></span>
      <div class="meta" id="readoutDir"></div></div>
    <div class="meta" id="readoutPlace"></div>
    <button class="forecastBtn" id="readoutForecast">Forecast for this point ›</button>
  </div>

  <div id="legend" hidden>
    <div class="gradient" id="legendGradient"></div>
    <div class="labels" id="legendLabels"></div>
  </div>

  <div id="controls" hidden>
    <button id="play" aria-label="Play or pause">⏸</button>
    <input id="slider" type="range" min="0" max="0" value="0">
    <span id="time"></span>
  </div>

  <script src="maplibre-gl.js"></script>
  <script src="wind.js"></script>
  <script>
    // Kotlin side (see MapScreen.kt) exposes `Android.onMapTap(lat, lon)`; absent when opened in a desktop browser.
    var RAINVIEWER_API = 'https://api.rainviewer.com/public/weather-maps.json';
    var RADAR_MAX_ZOOM = 7;       // RainViewer free tiles stop at zoom 7; MapLibre over-scales beyond it
    var RADAR_OPACITY = 0.7;

    var map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/dark',
      center: [4.35, 50.85],
      zoom: 5,
      attributionControl: false
    });
    // Top-right so the attribution never sits under the controls.
    map.addControl(new maplibregl.AttributionControl({ compact: true, customAttribution: 'Weather: NOAA GFS' }), 'top-right');

    var $ = function (id) { return document.getElementById(id); };
    var statusLabel = $('status'), slider = $('slider'), playBtn = $('play'), timeLabel = $('time');
    function setStatus(text) { statusLabel.textContent = text || ''; }

    var marker = null;
    var mode = 'wind';
    var wind = null;              // WindLayer, created once the map has loaded
    var radar = { frames: [], loaded: false };

    /* ---------------- timeline: one slider/play loop shared by radar and wind ---------------- */
    /* A source provides { count, label(i), show(i) -> Promise|void, delayMs(i) } and its starting index. */

    var timeline = { source: null, index: 0, playing: true, timer: null };

    function showIndex(i) {
      var src = timeline.source;
      if (!src) return Promise.resolve();
      timeline.index = ((i % src.count) + src.count) % src.count;
      slider.value = timeline.index;
      timeLabel.textContent = src.label(timeline.index);
      return Promise.resolve(src.show(timeline.index));
    }

    function scheduleNext() {
      clearTimeout(timeline.timer);
      var src = timeline.source;
      if (!timeline.playing || !src) return;
      timeline.timer = setTimeout(function () {
        // Wait for the frame to be ready before scheduling the next, so playback never outruns downloads.
        showIndex(timeline.index + 1).then(scheduleNext, scheduleNext);
      }, src.delayMs(timeline.index));
    }

    function setPlaying(value) {
      timeline.playing = value;
      playBtn.textContent = value ? '⏸' : '▶';
      value ? scheduleNext() : clearTimeout(timeline.timer);
    }

    function useSource(src, startIndex) {
      clearTimeout(timeline.timer);
      timeline.source = src;
      slider.max = src.count - 1;
      $('controls').hidden = false;
      showIndex(startIndex).then(scheduleNext, scheduleNext);
    }

    playBtn.addEventListener('click', function () { setPlaying(!timeline.playing); });
    slider.addEventListener('input', function () { setPlaying(false); showIndex(Number(slider.value)); });

    /* ---------------- radar ---------------- */

    var radarSource = {
      get count() { return radar.frames.length; },
      label: function (i) {
        return new Date(radar.frames[i].time * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      },
      show: function (i) {
        radar.frames.forEach(function (f, k) {
          map.setPaintProperty(f.layerId, 'raster-opacity', k === i ? RADAR_OPACITY : 0);
        });
      },
      // Pause briefly on the newest frame so the loop reads as "now".
      delayMs: function (i) { return i === radar.frames.length - 1 ? 1800 : 600; }
    };

    function loadRadar() {
      return fetch(RAINVIEWER_API)
        .then(function (r) { return r.json(); })
        .then(function (data) {
          ((data.radar && data.radar.past) || []).forEach(function (frame, i) {
            var id = 'radar-' + i;
            map.addSource(id, {
              type: 'raster',
              tiles: [data.host + frame.path + '/256/{z}/{x}/{y}/2/1_1.png'],
              tileSize: 256,
              maxzoom: RADAR_MAX_ZOOM,
              attribution: '<a href="https://www.rainviewer.com/">RainViewer</a>'
            });
            map.addLayer({
              id: id, type: 'raster', source: id,
              layout: { visibility: 'none' },
              paint: { 'raster-opacity': 0, 'raster-fade-duration': 0 }
            }, labelLayerId());
            radar.frames.push({ time: frame.time, layerId: id });
          });
          radar.loaded = true;
        });
    }

    function setRadarVisible(visible) {
      radar.frames.forEach(function (f) {
        map.setLayoutProperty(f.layerId, 'visibility', visible ? 'visible' : 'none');
      });
    }

    /* ---------------- satellite: EUMETSAT MTG (Europe, Africa, the Atlantic) ---------------- */

    var SAT_CAPS = 'https://view.eumetsat.int/geoserver/mtg_fd/ows?service=WMS&version=1.3.0&request=GetCapabilities';
    var SAT_LAYERS = { 'sat-colour': 'rgb_geocolour', 'sat-ir': 'ir105_hrfi' };  // names inside EUMETSAT's mtg_fd workspace
    var SAT_OPACITY = 0.92, SAT_STEP_MIN = 30, SAT_FRAMES = 7;                   // the last three hours, every half hour
    var sat = { caps: null, byLevel: {} };                                        // byLevel[level] = [{time (ms), layerId}]

    /**
     * The first place-name layer of the basemap. Imagery goes just under it: roads, borders and road names are
     * covered (they only add clutter on a satellite picture) while town and country names stay readable on top.
     */
    function labelLayerId() {
      var first = map.getStyle().layers.filter(function (l) { return l['source-layer'] === 'place'; })[0];
      return first ? first.id : undefined;
    }

    /** When the newest image of each satellite layer was taken (ms), read from the service's capabilities. */
    function loadSatCaps() {
      if (!sat.caps) {
        sat.caps = fetch(SAT_CAPS).then(function (r) { return r.text(); }).then(function (xml) {
          var ends = {};
          Object.keys(SAT_LAYERS).forEach(function (level) {
            var m = new RegExp('<Name>' + SAT_LAYERS[level] + '</Name>[\\s\\S]*?<Dimension[^>]*name="time"[^>]*>([^<]*)</Dimension>').exec(xml);
            if (m) ends[level] = Date.parse(m[1].split('/')[1]);  // "start/end/period"
          });
          return ends;
        });
        sat.caps.catch(function () { sat.caps = null; });
      }
      return sat.caps;
    }

    function loadSat(level) {
      if (sat.byLevel[level]) return Promise.resolve();
      return loadSatCaps().then(function (ends) {
        var end = ends[level];
        if (!end) throw new Error('no satellite time');
        var frames = [];
        for (var k = SAT_FRAMES - 1; k >= 0; k--) {
          var time = end - k * SAT_STEP_MIN * 60000, id = 'sat-' + level + '-' + k;
          map.addSource(id, {
            type: 'raster',
            tiles: ['https://view.eumetsat.int/geoserver/ows?service=WMS&version=1.3.0&request=GetMap&layers=mtg_fd:' +
              SAT_LAYERS[level] + '&styles=&format=image/png&transparent=true&crs=EPSG:3857&width=256&height=256' +
              '&bbox={bbox-epsg-3857}&time=' + new Date(time).toISOString()],
            tileSize: 256,
            attribution: 'Imagery &copy; <a href="https://www.eumetsat.int/">EUMETSAT</a>'
          });
          map.addLayer({
            id: id, type: 'raster', source: id,
            layout: { visibility: 'none' },
            paint: { 'raster-opacity': 0, 'raster-fade-duration': 0 }
          }, labelLayerId());
          frames.push({ time: time, layerId: id });
        }
        sat.byLevel[level] = frames;
      });
    }

    /** Shows the frames of one satellite layer and hides all the others (null hides everything). */
    function setSatVisible(level) {
      Object.keys(sat.byLevel).forEach(function (lv) {
        sat.byLevel[lv].forEach(function (f) { map.setLayoutProperty(f.layerId, 'visibility', lv === level ? 'visible' : 'none'); });
      });
    }

    var satSource = {
      get count() { return sat.byLevel[modeLevel.satellite].length; },
      label: function (i) {
        return new Date(sat.byLevel[modeLevel.satellite][i].time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      },
      show: function (i) {
        sat.byLevel[modeLevel.satellite].forEach(function (f, k) {
          map.setPaintProperty(f.layerId, 'raster-opacity', k === i ? SAT_OPACITY : 0);
        });
      },
      delayMs: function (i) { return i === sat.byLevel[modeLevel.satellite].length - 1 ? 1800 : 700; }
    };

    function showSatellite(level) {
      var requestedMode = mode;
      setStatus('Loading satellite…');
      loadSat(level).then(function () {
        if (mode !== requestedMode || modeLevel.satellite !== level) return;  // the user already moved on
        setStatus('');
        setSatVisible(level);
        useSource(satSource, sat.byLevel[level].length - 1);
      }).catch(function () { setStatus('Could not load satellite imagery'); });
    }

    /* ---------------- field layers: wind, clouds, rain ---------------- */

    // Each mode that draws from the weather textures: its level chips as [texture folder, label].
    var FIELD_MODES = {
      wind: [['surface', 'Surface'], ['gusts', 'Gusts'], ['850mb', '850 hPa'], ['250mb', '250 hPa · jet']],
      temperature: [['temp', 'Air temperature', 'Air'], ['feels', 'Feels like', 'Feels like'],
                    ['freezing', 'Freezing level · where it is 0°', 'Freezing level']],
      air: [['pressure', 'Sea-level pressure · isobars', 'Pressure'], ['humidity', 'Humidity', 'Humidity']],
      storms: [['cape', 'Storm energy (CAPE)']],
      snow: [['snow', 'Snow depth']],
      clouds: [['clouds-total', 'Total'], ['clouds-low', 'Low'], ['clouds-mid', 'Mid'], ['clouds-high', 'High']],
      rain: [['precip', 'Rain rate', 'Rate'], ['rainacc-3h', 'Rain total · past 3 hours', '3 h'], ['rainacc-24h', 'Rain total · past 24 hours', '24 h']],
      waves: [['waves-height', 'Wave height'], ['waves-swell', 'Swell'], ['waves-period', 'Wave period']],
      turbulence: [['cat-fl300', 'FL300 · 9.1 km', 'FL300'], ['cat-fl340', 'FL340 · 10.4 km', 'FL340'], ['cat-fl390', 'FL390 · 11.9 km', 'FL390']]
    };
    var modeLevel = { wind: 'surface', clouds: 'clouds-total', rain: 'precip', waves: 'waves-height', turbulence: 'cat-fl340',
                      satellite: 'sat-colour', temperature: 'temp', air: 'pressure', storms: 'cape', snow: 'snow' };  // last level chosen per mode
    function isFieldMode(m) { return !!FIELD_MODES[m]; }

    var fieldSource = {
      get count() { return wind.hourCount(); },
      label: function (i) {
        var d = new Date(wind.timeOf(i));
        return d.toLocaleDateString([], { weekday: 'short' }) + ' ' +
          d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      },
      show: function (i) {
        wind.prefetch(i + 3); wind.prefetch(i + 6);
        return wind.setStep(i).then(updateReadout);
      },
      delayMs: function () { return 400; }
    };

    /** Wall-clock time the timeline is showing, or null when it is not showing a field layer. */
    function currentTimeMs() {
      return timeline.source === fieldSource && wind && wind.meta ? wind.timeOf(timeline.index) : null;
    }

    function updateLegend() {
      var l = wind.legend();
      $('legendGradient').style.background = l.gradient;
      var box = $('legendLabels');
      box.innerHTML = '';
      l.labels.forEach(function (label) {
        var span = document.createElement('span');
        span.textContent = label.text;
        span.style.left = (label.pos * 100) + '%';
        span.style.transform = label.pos <= 0 ? 'none' : label.pos >= 1 ? 'translateX(-100%)' : 'translateX(-50%)';
        box.appendChild(span);
      });
    }

    /* ---------------- tap readout ---------------- */

    var tapPoint = null;          // {lat, lon} of the last tap, or null
    var windUnit = 'KmH';         // the three units are set by the app from the user's settings (see MapScreen.kt)
    var precipUnit = 'Millimetres', lengthUnit = 'Metric', tempUnit = 'Celsius';
    var BEAUFORT_KMH = [1, 5, 11, 19, 28, 38, 49, 61, 74, 88, 102, 117];
    var COMPASS = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
    var LEVEL_NAMES = {
      gusts: 'Wind gusts', temp: 'Air temperature (2 m)', feels: 'Feels-like temperature', freezing: 'Freezing level',
      pressure: 'Sea-level pressure', humidity: 'Relative humidity', cape: 'Storm energy (CAPE)', snow: 'Snow depth',
      surface: 'Surface (10 m)', '850mb': '850 hPa (~1.5 km)', '250mb': '250 hPa (~10 km)',
      'waves-height': 'Wave height', 'waves-swell': 'Main swell height', 'waves-period': 'Wave period',
      'cat-fl300': 'Turbulence at FL300', 'cat-fl340': 'Turbulence at FL340', 'cat-fl390': 'Turbulence at FL390',
      'rainacc-3h': 'Rain total, past 3 hours', 'rainacc-24h': 'Rain total, past 24 hours',
      'clouds-total': 'Total cloud cover', 'clouds-low': 'Low clouds', 'clouds-mid': 'Mid-level clouds', 'clouds-high': 'High clouds'
    };

    /** A rain amount, given in mm (or mm/h when per is "/h"), in the user's unit. */
    function formatRain(mm, per) {
      if (precipUnit === 'Inches') {
        var inch = mm / 25.4;
        return (inch < 0.01 ? '<0.01' : inch.toFixed(2)) + ' in' + per;
      }
      return (mm < 10 ? mm.toFixed(1) : Math.round(mm)) + ' mm' + per;
    }

    function formatTemp(celsius) {
      return tempUnit === 'Fahrenheit' ? Math.round(celsius * 9 / 5 + 32) + '°F' : Math.round(celsius) + '°C';
    }

    function formatSnow(metres) {
      if (precipUnit === 'Inches') return (metres / 0.0254).toFixed(metres < 0.25 ? 1 : 0) + ' in';
      var cm = metres * 100;
      return (cm < 10 ? cm.toFixed(1) : Math.round(cm)) + ' cm';
    }

    function formatHeight(metres) {
      return lengthUnit === 'Imperial' ? Math.round(metres / 0.3048 / 100) * 100 + ' ft' : Math.round(metres / 10) * 10 + ' m';
    }

    function formatWaveHeight(metres) {
      return lengthUnit === 'Imperial' ? Math.round(metres / 0.3048) + ' ft' : metres.toFixed(1) + ' m';
    }

    function formatSpeed(ms) {
      var kmh = ms * 3.6;
      switch (windUnit) {
        case 'Ms': return ms.toFixed(1) + ' m/s';
        case 'Knots': return Math.round(ms * 1.943844) + ' kt';
        case 'Beaufort':
          var force = BEAUFORT_KMH.findIndex(function (b) { return kmh < b; });
          return (force < 0 ? 12 : force) + ' Bft';
        default: return Math.round(kmh) + ' km/h';
      }
    }

    function updateReadout() {
      var box = $('readout');
      if (!tapPoint) { box.hidden = true; return; }
      box.hidden = false;
      var v = isFieldMode(mode) && wind ? wind.windAt(tapPoint.lon, tapPoint.lat) : null;
      $('readoutWind').hidden = !v;
      if (v) {
        var when = timeLabel.textContent;
        $('readoutArrow').hidden = wind.kind !== 'wind';
        if (wind.kind === 'wind') {
          var speed = Math.sqrt(v.u * v.u + v.v * v.v);
          // Meteorological direction is where the wind comes FROM; the arrow points where it blows TO.
          var from = (Math.atan2(-v.u, -v.v) * 180 / Math.PI + 360) % 360;
          $('readoutSpeed').textContent = formatSpeed(speed);
          $('readoutArrow').style.transform = 'rotate(' + (from + 180) + 'deg)';
          $('readoutDir').textContent = 'from ' + COMPASS[Math.round(from / 22.5) % 16] + ' · ' + LEVEL_NAMES[wind.level] + ' · ' + when;
        } else if (wind.kind === 'wave') {
          // v.u metres; (v.v, v.w) is the east/north unit vector the waves travel toward.
          var heading = (Math.atan2(v.v, v.w) * 180 / Math.PI + 360) % 360;
          var cameFrom = (heading + 180) % 360;
          var isSea = v.u >= 0.05 && Math.sqrt(v.v * v.v + v.w * v.w) >= 0.3;
          $('readoutArrow').hidden = !isSea;
          $('readoutSpeed').textContent = isSea ? formatWaveHeight(v.u) : 'No wave data';
          $('readoutArrow').style.transform = 'rotate(' + heading + 'deg)';
          $('readoutDir').textContent = (isSea ? 'from ' + COMPASS[Math.round(cameFrom / 22.5) % 16] + ' · ' : 'Land · ') +
            LEVEL_NAMES[wind.level] + ' · ' + when;
        } else if (wind.kind === 'scalar') {
          var sv = wind.scalarValue([v.u, v.v, v.w]), lvl = wind.level, text, detail = LEVEL_NAMES[lvl];
          if (lvl === 'temp' || lvl === 'feels') text = formatTemp(sv);
          else if (lvl === 'pressure') text = Math.round(sv) + ' hPa';
          else if (lvl === 'humidity') text = Math.round(sv) + '%';
          else if (lvl === 'gusts') text = formatSpeed(sv);
          else if (lvl === 'cape') {
            text = Math.round(sv) + ' J/kg';
            detail += ' · ' + (sv < 300 ? 'little' : sv < 1000 ? 'moderate' : sv < 2500 ? 'strong' : 'extreme');
          } else if (lvl === 'snow') text = sv < 0.005 ? 'No snow' : formatSnow(sv);
          else text = formatHeight(sv);  // freezing level
          $('readoutSpeed').textContent = text;
          $('readoutDir').textContent = detail + ' · ' + when;
        } else if (wind.kind === 'rainacc') {
          var total = v.u * v.u * wind.accMax();  // the texture stores sqrt(mm / max)
          $('readoutSpeed').textContent = total < 0.1 ? 'No rain' : formatRain(total, '');
          $('readoutDir').textContent = LEVEL_NAMES[wind.level] + ' · ' + when;
        } else if (wind.kind === 'turbulence') {
          var ti = v.u;  // Ellrod index, 1e-7 s^-2
          var grade = ti < 4 ? 'Smooth' : ti < 8 ? 'Light' : ti < 12 ? 'Moderate' : 'Severe';
          $('readoutSpeed').textContent = grade;
          $('readoutDir').textContent = LEVEL_NAMES[wind.level] + ' · index ' + ti.toFixed(1) + ' · ' + when;
        } else if (wind.kind === 'period') {
          $('readoutSpeed').textContent = v.u < 0.5 ? 'No wave data' : v.u.toFixed(1) + ' s';
          $('readoutDir').textContent = 'Time between waves · ' + when;
        } else if (wind.kind === 'cloud') {
          $('readoutSpeed').textContent = Math.round(Math.max(0, Math.min(1, v.u)) * 100) + '% cloud';
          $('readoutDir').textContent = LEVEL_NAMES[wind.level] + ' · ' + when;
        } else {
          var rate = v.u * v.u * 50;  // the texture stores sqrt(rate / 50 mm/h)
          $('readoutSpeed').textContent = rate < 0.05 ? 'No precipitation' : formatRain(rate, '/h');
          $('readoutDir').textContent = (rate < 0.05 ? '' : (v.v > 0.5 ? 'Snow · ' : 'Rain · ')) + when;
        }
      }
      $('readoutPlace').textContent = tapPoint.lat.toFixed(3) + ', ' + tapPoint.lon.toFixed(3);
    }

    $('readoutForecast').addEventListener('click', function () {
      if (tapPoint && window.Android && Android.openPointForecast) Android.openPointForecast(tapPoint.lat, tapPoint.lon);
    });

    $('readoutClose').addEventListener('click', function () {
      tapPoint = null;
      if (marker) { marker.remove(); marker = null; }
      updateReadout();
    });

    window.setUnits = function (wind_, precip, length, temp) {
      windUnit = wind_; precipUnit = precip; lengthUnit = length; tempUnit = temp || tempUnit;
      if (wind) wind.units = { wind: wind_, precip: precip, length: length, temp: tempUnit };
      if (wind && wind.meta && isFieldMode(mode)) updateLegend();
      updateReadout();
    };

    /* ---------------- modes and chips ---------------- */

    /** What the layer menu lists: a group per mode, each item a [texture folder, label] pair. */
    var MENU = [
      { mode: 'wind', icon: '🌬️', title: 'Wind', items: FIELD_MODES.wind },
      { mode: 'clouds', icon: '☁️', title: 'Clouds', items: FIELD_MODES.clouds },
      { mode: 'rain', icon: '🌧️', title: 'Rain & snow', items: FIELD_MODES.rain },
      { mode: 'temperature', icon: '🌡️', title: 'Temperature', items: FIELD_MODES.temperature },
      { mode: 'air', icon: '🧭', title: 'Pressure & humidity', items: FIELD_MODES.air },
      { mode: 'storms', icon: '⛈️', title: 'Thunderstorms', items: FIELD_MODES.storms },
      { mode: 'snow', icon: '❄️', title: 'Snow', items: FIELD_MODES.snow },
      { mode: 'waves', icon: '🌊', title: 'Waves', items: FIELD_MODES.waves },
      { mode: 'turbulence', icon: '✈️', title: 'Turbulence', items: FIELD_MODES.turbulence },
      { mode: 'satellite', icon: '🛰️', title: 'Satellite',
        items: [['sat-colour', 'Natural colour · infrared at night', 'Colour'], ['sat-ir', 'Infrared · cloud-top temperature', 'Infrared']] },
      { mode: 'radar', icon: '📡', title: 'Radar', items: [['radar', 'Observed rain, past 2 hours']] }
    ];

    /** Opens the menu with the group of the layer being shown expanded, so the active choice is in view. */
    function openMenu() {
      $('menu').hidden = false;
      setGroupOpen(mode, true);
    }

    function applyGroupOpen(groupMode, open) {
      document.querySelectorAll('#menu [data-group="' + groupMode + '"]').forEach(function (el) {
        if (el.classList.contains('group')) {
          el.classList.toggle('open', open);
          el.lastChild.textContent = open ? '▴' : '▾';
        } else {
          el.hidden = !open;
        }
      });
    }

    /** Opens or closes a group. Only one group is open at a time, which keeps a long menu short. */
    function setGroupOpen(groupMode, open) {
      if (open) MENU.forEach(function (g) { if (g.mode !== groupMode) applyGroupOpen(g.mode, false); });
      applyGroupOpen(groupMode, open);
    }
    function closeMenu() { $('menu').hidden = true; }

    function buildMenu() {
      var sheet = $('menuSheet');
      sheet.innerHTML = '<h2>Layers</h2>';
      MENU.forEach(function (group) {
        var title = document.createElement('button');
        title.className = 'group';
        title.dataset.group = group.mode;
        title.innerHTML = '<span>' + group.icon + '&nbsp;&nbsp;' + group.title + '</span><span>▾</span>';
        title.addEventListener('click', function () { setGroupOpen(group.mode, !title.classList.contains('open')); });
        sheet.appendChild(title);
        group.items.forEach(function (item) {
          var b = document.createElement('button');
          b.className = 'item';
          b.dataset.group = group.mode;
          b.hidden = true;  // groups start collapsed; the active one is opened below
          b.dataset.mode = group.mode;
          b.dataset.level = item[0];
          b.dataset.short = item[2] || item[1];  // shorter name for the top bar
          b.textContent = item[1];
          b.addEventListener('click', function () { selectLayer(group.mode, item[0]); });
          sheet.appendChild(b);
        });
      });
      setGroupOpen(mode, true);
      $('menuBtn').addEventListener('click', openMenu);
      $('menuBackdrop').addEventListener('click', closeMenu);
    }

    function selectLayer(newMode, level) {
      closeMenu();
      if (newMode === 'radar') { if (mode !== 'radar') setMode('radar'); return; }
      modeLevel[newMode] = level;
      if (mode !== newMode) setMode(newMode);
      else if (newMode === 'satellite') { markChips(); showSatellite(level); }
      else chooseLevel(level);
    }

    /** Highlights the active menu item and names the layer in the top bar. */
    function markChips() {
      var label = '';
      document.querySelectorAll('#menu .item').forEach(function (b) {
        var on = b.dataset.mode === mode && (mode === 'radar' || b.dataset.level === modeLevel[mode]);
        b.classList.toggle('on', on);
        if (on) {
          var group = MENU.filter(function (g) { return g.mode === mode; })[0];
          label = group.items.length > 1 ? group.title + ' · ' + b.dataset.short : group.title;
        }
      });
      $('layerName').textContent = label;
      $('legend').hidden = !isFieldMode(mode);
    }

    /** Shows a texture layer at the time the timeline is on (or now, when coming from elsewhere). */
    function showLevel(level, timeMs) {
      var requestedMode = mode;
      return wind.useLevel(level).then(function () {
        if (mode !== requestedMode) return;  // the user already moved on
        updateLegend();
        useSource(fieldSource, timeMs === null ? wind.nowIndex() : wind.indexForTime(timeMs));
      }).catch(function () { setStatus('Could not load weather data'); });
    }

    function chooseLevel(level) {
      modeLevel[mode] = level;
      markChips();
      showLevel(level, currentTimeMs());
    }

    function setMode(next) {
      var timeMs = currentTimeMs();  // read before anything changes, so the chosen time carries over
      mode = next;
      setStatus('');
      if (isFieldMode(mode)) {
        setRadarVisible(false); setSatVisible(null);
        wind.show();
        showLevel(modeLevel[mode], timeMs);
      } else if (mode === 'satellite') {
        wind.hide(); setRadarVisible(false);
        showSatellite(modeLevel.satellite);
      } else {
        wind.hide(); setSatVisible(null);
        if (!radar.loaded) { setStatus('Loading radar…'); }
        var ready = radar.loaded ? Promise.resolve() : loadRadar();
        ready.then(function () {
          if (mode !== 'radar') return;
          setStatus(radar.frames.length ? '' : 'No radar data available');
          if (!radar.frames.length) return;
          setRadarVisible(true);
          useSource(radarSource, radar.frames.length - 1);
        }).catch(function () { setStatus('Could not load radar'); });
      }
      markChips();
      updateReadout();
    }

    map.on('load', function () {
      // Start with the attribution collapsed to its (i) button; it expands when tapped.
      var attrib = document.querySelector('.maplibregl-ctrl-attrib');
      if (attrib) { attrib.classList.remove('maplibregl-compact-show'); attrib.removeAttribute('open'); }

      var host = document.createElement('div');
      host.id = 'overlay';
      map.getContainer().appendChild(host);
      wind = new WindLayer(map, host);
      wind.units = { wind: windUnit, precip: precipUnit, length: lengthUnit, temp: tempUnit };  // the app may have sent them before this existed
      buildMenu();
      setMode('wind');
    });

    map.on('click', function (e) {
      if (marker) marker.remove();
      marker = new maplibregl.Marker({ color: '#9fa8ff' }).setLngLat(e.lngLat).addTo(map);
      tapPoint = { lat: e.lngLat.lat, lon: e.lngLat.lng };
      updateReadout();
      if (window.Android) window.Android.onMapTap(e.lngLat.lat, e.lngLat.lng);
    });

    // Called from Kotlin via evaluateJavascript.
    window.setCenter = function (lat, lon, zoom) {
      map.jumpTo({ center: [lon, lat], zoom: zoom });
    };
  </script>
</body>
</html>
