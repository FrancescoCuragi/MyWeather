name: Build weather data

# GFS runs at 00/06/12/18 UTC and is fully published about 5 hours later; run a little after that.
on:
  schedule:
    - cron: "30 5,11,17,23 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two builds at once; a newer run replaces an older one that is still queued.
concurrency:
  group: wind-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Build wind textures
        working-directory: pipeline
        run: python build_wind.py --out ../site/wind
      - name: Build cloud and precipitation textures
        working-directory: pipeline
        run: python build_fields.py --out ../site/fields
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
